name: "🚀 Continuous Delivery (CD)"

on:
  workflow_run:
    workflows: ["🩺 Continuous Integration (CI)"]
    types: [completed]
    branches: [master]

permissions:
  contents: read

env:
  INFRA_REPO: k5sha/k5sha-gitops
  MANIFEST_PATH: manifests/tg-bot
  MANIFEST_FILE: deployment.yaml
  REGISTRY: ghcr.io

jobs:
  update-manifest:
    name: 🔄 Update Kubernetes Manifest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tg-bot-production
      cancel-in-progress: false
    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.INFRA_REPO }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra-repo

      - name: Update image tag
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd "infra-repo/${MANIFEST_PATH}"
          REPO_LOWER=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          IMAGE="${REGISTRY}/${REPO_LOWER}"
          TAG="${HEAD_SHA:0:7}"
          MATCHES=$(grep -Fc "image: ${IMAGE}:" "${MANIFEST_FILE}")
          test "${MATCHES}" -eq 1
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|g" "${MANIFEST_FILE}"
          grep -Fq "image: ${IMAGE}:${TAG}" "${MANIFEST_FILE}"
          echo "Updated ${IMAGE}:${TAG}"

      - name: Commit and push
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          cd infra-repo
          git config user.email "github-actions@github.com"
          git config user.name "GitHub Actions"
          git add "${MANIFEST_PATH}/${MANIFEST_FILE}"
          if git diff --staged --quiet; then
            echo "Manifest already uses this image"
          else
            git commit -m "chore(cd): update tg-bot to ${HEAD_SHA:0:7}"
            git push
          fi
